name: astrbot_plugin_ret2shell
display_name: Ret2Shell 赛事播报
desc: |
  对接 Ret 2 Shell (回归终端) 赛事事件推送 WebSocket API，
  实现赛事事件实时播报和信息查询功能。

  功能特性：
  - 实时推送赛事事件（题目上/下线、一/二/三血、新通知等）
  - 查询赛事信息 (/game)
  - 查询积分排行 (/rank [标签])
  - 支持多目标 UMO 推送（公开/管理/运维三级分类）

  配置说明：
  - ret2shell_ws_link: Ret2Shell WebSocket 地址（必填）
  - public_umo: 公开播报目标 UMO 列表
  - admin_umo: 管理播报目标 UMO 列表
  - ops_umo: 运维播报目标 UMO 列表
version: 1.1.0
author: decimo
repo: https://github.com/xiaochai-123/astrbot_plugin_ret2shell
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - ctf
  - ret2shell
  - 赛事播报